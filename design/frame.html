<!doctype html>
<!--
  Harness 界面框架：只标出插件能放在哪、有多大。灰块都是 Harness 自己的，不用设计。
  用法：把原型放进 prototypes/，然后打开 frame.html?src=prototypes/你的文件.html
  尺寸按 Harness 桌面版实测（窗口 1140×765，左栏 280，右侧栏默认 460，可拖动）。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Harness 框架</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { margin: 0; padding: 24px; background: #ddd; font-size: 13px; }
  .bar { margin-bottom: 12px; display: flex; gap: 8px; align-items: center; }
  .bar button { padding: 4px 12px; border: 1px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
  .bar button.on { background: #222; color: #fff; }
  .win { width: 1140px; height: 765px; display: flex; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,.15); }
  .host { background: #f0f1f3; color: #999; padding: 16px; box-sizing: border-box; }
  .left { width: 280px; flex: none; }
  .left div { padding: 8px 0; }
  .center { flex: 1; min-width: 300px; background: #fafafa; display: flex; flex-direction: column; justify-content: flex-end; }
  .center .input { border: 1px solid #ddd; border-radius: 12px; height: 80px; padding: 10px; background: #fff; }
  .right { width: 460px; flex: none; display: flex; flex-direction: column; border-left: 1px solid #e5e5e5; }
  .tab { height: 48px; flex: none; padding: 0 16px; display: flex; align-items: center; background: #f0f1f3; color: #999; }
  .slot { flex: 1; border: 0; width: 100%; background: var(--dsw-alias-bg-base); }
  .win.full .center, .win.full .right { display: none; }
  .win.full .main { display: flex; }
  .main { display: none; flex: 1; flex-direction: column; }
</style>
</head>
<body>
<div class="bar">
  <button id="b-side" class="on">右侧栏（和对话并排，主要用这个）</button>
  <button id="b-full">全屏（左侧导航「学习」）</button>
  <span id="info"></span>
</div>
<div class="win" id="win">
  <div class="host left">
    <div>DeepSeek Harness</div>
    <div>新会话</div>
    <div>插件</div>
    <div>插件市场</div>
    <div>自动化任务</div>
    <div><b>学习</b> ← 点这里进全屏</div>
    <div>更多</div>
    <div style="margin-top:24px">工作区 / 会话列表</div>
  </div>
  <div class="host center">
    <div style="flex:1">对话区（Harness 自己的，不用设计）</div>
    <div class="input">输入框：用户在这里和 AI 说话，比如「记错题」</div>
  </div>
  <div class="right" id="right">
    <div class="tab">学习书架 ×　（侧栏标签，Harness 自带）</div>
    <iframe class="slot" id="slot-side"></iframe>
  </div>
  <div class="main" id="main">
    <iframe class="slot" id="slot-full"></iframe>
  </div>
</div>
<script>
  const src = new URLSearchParams(location.search).get('src')
  const empty = 'data:text/html;charset=utf-8,' + encodeURIComponent(
    '<body style="font:14px sans-serif;color:#888;padding:20px">插件区域。<br>用 frame.html?src=prototypes/你的文件.html 把原型放进来。</body>')
  const win = document.getElementById('win')
  const sideFrame = document.getElementById('slot-side'), fullFrame = document.getElementById('slot-full')
  function show(full) {
    win.classList.toggle('full', full)
    document.getElementById('b-side').classList.toggle('on', !full)
    document.getElementById('b-full').classList.toggle('on', full)
    const frame = full ? fullFrame : sideFrame
    if (!frame.src) frame.src = src || empty
    document.getElementById('info').textContent = full ? '插件区域约 860 × 765' : '插件区域约 460 × 717（用户可以拖宽）'
  }
  document.getElementById('b-side').onclick = () => show(false)
  document.getElementById('b-full').onclick = () => show(true)
  show(false)
</script>
</body>
</html>
